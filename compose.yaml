services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: testimony_tasks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - testimony_tasks_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testimony_tasks"]
      interval: 3s
      timeout: 3s
      retries: 15
  app:
    build: .
    command: sh -c "npm run db:migrate && npm start"
    environment:
      PORT: 3000
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/testimony_tasks
      JWT_SECRET: local-only-secret-change-before-production
      TOKEN_ENCRYPTION_KEY: local-only-token-key-change-before-production
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_DAILY_MODEL: openai/gpt-oss-20b
      GROQ_LONG_MODEL: openai/gpt-oss-120b
      DEMO_MODE: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  testimony_tasks_data:

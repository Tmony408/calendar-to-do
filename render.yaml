services:
  - type: web
    name: tmony
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tmony-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_DAILY_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_LONG_MODEL
        value: openai/gpt-oss-120b
      - key: DEMO_MODE
        value: "false"

databases:
  - name: tmony-db
    plan: free
    databaseName: tmony
    user: tmony
